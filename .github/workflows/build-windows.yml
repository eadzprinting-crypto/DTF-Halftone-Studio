
name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --noconfirm --onefile --windowed --name DTF-Halftone-Studio dtf_halftone_studio.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: DTF-Halftone-Studio-Windows
          path: dist/DTF-Halftone-Studio.exe
